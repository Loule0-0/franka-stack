[project]
name = "franka-runtime"
version = "0.1.0"
description = "Profile-scoped runtime contracts, safety filtering, and action chunking for Franka deployment."
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.22.4,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
